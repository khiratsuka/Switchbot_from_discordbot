name: Deploy to GCP-VM
 
on:
  push:
    branches:
      - feature-actions
 
jobs:
  deploy:
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4
 
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: switchbot-from-discordbot
          workload_identity_provider: ${{ secrets.IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Setup Ansible
        id: setup_ansible
        run: |
          pip install ansible-core requests google-auth
          ansible-galaxy collection install google.cloud
    
      - name: Setup Ansible inventory
        id: setup_inventory
        run: |
          pwd
          cat ansible/inventories/bot_container/bot_container.gcp.yaml
          sed -i "s|<your-access-token>|${{steps.auth.outputs.access_token}}|" ansible/inventories/bot_container/bot_container.gcp.yaml
          ansible-inventory --list -i ansible/inventories/bot_container/bot_container.gcp.yaml

      - name: test on VM
        run: |
          gcloud compute ssh khiratsuka-containers@khiratsuka-containers-vm \
            --zone us-west1-a \
            --quiet \
            --command='
              rm ~/.ssh/authorized_keys
            '
